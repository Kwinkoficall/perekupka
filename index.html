function showBal(){const el=$("#bal"),to=S.bal;if(_balShown===null||matchMedia("(prefers-reduced-motion:reduce)").matches){_balShown=to;el.textContent=fmt(to);return}
  if(to===_balShown){el.textContent=fmt(to);return}
  const from=_balShown,t0=performance.now(),D=700;_balShown=to;cancelAnimationFrame(_balRaf);
  el.classList.remove("up","down");void el.offsetWidth;el.classList.add(to>from?"up":"down");haptic(to>from?"success":"warning");
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));if(k<1)_balRaf=requestAnimationFrame(step);else setTimeout(()=>el.classList.remove("up","down"),400)};
  _balRaf=requestAnimationFrame(step)}

function openHaggle(id){const c=S.market.find(x=>x.id===id);if(!c)return;S.sess[id]=S.sess[id]||{att:0,last:0,agr:0};H={id,log:[],dead:false,arg:0,err:""};drawHaggle()}
function drawHaggle(){
  const c=S.market.find(x=>x.id===H.id),s=S.sess[H.id],left=ATT-s.att,price=s.agr||c.ask,suggest=Math.round(price*.9/1e3)*1e3;
  $("#sheet").innerHTML=`${carSvg(c)}<div class="row"><h2 style="margin:0">${c.brand} ${c.model}, ${c.year}</h2><span class="tag n">${fmt(price)}</span></div>

  ${vis(c).filter(d=>DEF[d.key].r).length&&!H.dead?`<div class="gap">${vis(c).filter(d=>DEF[d.key].r).map(d=>`<button class="chip ${H.arg===d.id?"on":""}" style="flex:0 0 auto" data-arg="${d.id}">Довод: ${DEF[d.key].n}</button>`).join("")}</div>`:""}
  <div class="log">${H.log.map(t=>`<div>${t}</div>`).join("")}</div><div class="bad" style="font-size:14px">${H.err}</div>
  ${H.dead?"<b class='bad'>Сделка сорвана: продавец заблокировал вас на 30 минут.</b><div class='gap'><button class='g' data-close='1'>Закрыть</button></div>":
  `<div class="gap" style="align-items:center"><input type="number" step="1000" id="offer" value="${H.offer||suggest}"><button data-offer="1" style="flex:0 0 auto" ${left<=0?"disabled":""}>Предложить (${left})</button></div>
  <div class="gap"><button class="g" data-inspect="1">Осмотр ${vip()?"бесплатно (VIP)":fmt(INSPECT)}</button><button class="s" data-buy="1" style="flex:2">Купить за ${fmt(price)}</button></div><div class="gap"><button class="g" data-close="1">Закрыть</button></div>`}`;
  $("#modal").classList.add("open");

function act(e){
  const t=e.target.closest("button,[data-open],[data-thread],[data-admpick]");if(!t)return;const d=t.dataset;
  if(d.sub){chUrl&&(tg?.openTelegramLink?tg.openTelegramLink(chUrl):window.open(chUrl,"_blank"));return}
  if(d.recheck){boot();return}
  if(d.daily){openDaily();return}
  if(d.dailyclaim){claimDaily();return}
  if(d.topby){topBy=d.topby;render();loadTop();return}
  if(d.refshare){shareRef();return}
  if(d.refcopy){copyRef();return}
  if(d.shop){buyShop(d.shop);return}
  if(d.admself){adm.t=String(tg?.initDataUnsafe?.user?.id||"");render();return}
  if(d.admpick){adm.t=d.admpick;render();return}
  if(d.admload){loadUsers();return}
  if(d.admgrant){adminGrant();return}
  if(d.admvip){adminVip(false);return}
  if(d.admrevoke){adminVip(true);return}
  if(d.admsvc){adminService(false);return}
  if(d.admsvcrevoke){adminService(true);return}
  if(d.admdays){adm.d=d.admdays;render();return}
  if(d.tab){tab=d.tab;flash={};render();if(tab==="profile"&&isAdmin&&!adm.users.length)loadUsers();if(tab==="top")loadTop();if(tab==="profile")loadRef();return}
  if(d.open){openHaggle(+d.open);return}
  if(d.thread){T=+d.thread;terr="";S.threads.find(x=>x.id===T).unread=false;save();drawNav();drawThread();return}
  if(T&&!d.close){threadAct(d);return}
  if(d.close){closeM();return}
  if(d.reset){if(confirm("Удалить весь прогресс?")){localStorage.removeItem(KEY);location.reload()}return}
  if(H){const c=S.market.find(x=>x.id===H.id),s=S.sess[H.id];H.err="";
    if(d.arg){H.arg=H.arg===+d.arg?0:+d.arg;H.offer=+$("#offer").value}
    if(d.inspect){const ic=vip()?0:INSPECT;if(S.bal<ic)H.err="Не хватает денег на осмотр";else{S.bal-=ic;const f=c.defects.filter(x=>!x.disc&&Math.random()<.6);f.forEach(x=>x.disc=true);H.log.push(`Осмотр (−${fmt(ic)}): ${f.length?f.map(x=>DEF[x.key].n).join(", "):"ничего нового"}`);showBal()}}
    if(d.offer){const o=+$("#offer").value,bl=S.blocks[c.bot.name];
      if(bl>Date.now())H.err="Продавец вас заблокировал";else if(s.att>=ATT)H.err="Попытки закончились";
      else{const dd=c.defects.find(x=>x.id===H.arg&&x.disc),arg=dd?dd.cost:0;s.att++;
        const r=haggle(o,c,floorP(c.ask,c.bot),s.att,arg,s.last);H.log.push(`Вы: ${fmt(o)}`,`${c.bot.name}: ${r.m}`);
        if(r.k==="insult"){S.blocks[c.bot.name]=Date.now()+BLOCK;H.dead=true}else{s.agr=s.last=r.p;H.offer=r.p}}}
    if(d.buy){const p=s.agr||c.ask;if(S.bal<0)H.err="Вы банкрот: сначала закройте долги";else if(S.bal<p)H.err="Не хватает денег";else{
      S.bal-=p;S.bought++;S.market=S.market.filter(x=>x.id!==c.id);Object.assign(c,{status:"transit",until:Date.now()+2*TS,bought:p});S.cars.push(c);
      S.deals.unshift({kind:"buy",title:`${c.brand} ${c.model} ${c.year}`,price:p,margin:0,fraud:false});closeM();return}}
    save();drawHaggle();return}
  if(d.keep){const c=S.cars.find(x=>x.id==d.keep);c.keep=!c.keep;flash={};render();return}
  if(d.reg){const id=+d.reg,c=S.cars.find(x=>x.id===id),w=c.defects.find(x=>x.key==="welded_body"&&!x.rep);
    if(w&&!w.disc&&Math.random()<.5){w.disc=true;flash[id]="ГИБДД: кузов признан перебитым — отказ. Нужен ремонт."}
    else if(w&&w.disc)flash[id]="Отказ в регистрации: перебитый кузов. Сначала ремонт."
    else if(S.bal<REG)flash[id]=`Нужно ${fmt(REG)}`
    else{S.bal-=REG;c.inv+=REG;c.status="reg";c.until=Date.now()+REG_H*TS;c.pend=plate();flash[id]="Документы поданы, номера скоро будут готовы"}
    render();return}
  if(d.rep){const[id,prov]=d.rep.split(":"),c=S.cars.find(x=>x.id==id);let mult,tm;
    if(prov==="own"){if(!operational()){flash[id]="Своя мастерская ещё не достроена";return render()}const[cm,t2]=mods();mult=Math.max(OWN_MIN,EXT*cm);tm=t2}
    else{mult=EXT;tm=1;c.defects.forEach(x=>{if(!x.disc&&Math.random()<.5)x.disc=true})}
    if(vip()){mult*=VIP.repairCost;tm*=VIP.repairTime}
    const todo=c.defects.filter(x=>x.disc&&!x.rep&&DEF[x.key].r),tot=todo.reduce((s,x)=>s+Math.floor(x.cost*mult),0);
    if(!todo.length)flash[id]="Чинить нечего";else if(S.bal<tot)flash[id]=`Нужно ${fmt(tot)}`;
    else{S.bal-=tot;c.inv+=tot;c.status="service";let mx=0;todo.forEach(x=>{const h=DEF[x.key].hr*tm;mx=Math.max(mx,h);x.fix=Date.now()+h*TS});c.until=Date.now()+mx*TS;flash[id]=`Заказано: ${fmt(tot)}`}
    render();return}
  if(d.sell){const id=+d.sell,c=S.cars.find(x=>x.id===id),price=+$("#p"+id).value;flash["p"+id]=price||"";
    if(!price||price<1e3)flash[id]="Укажите цену";
    else{c.status="for_sale";c.listed={price,disclose:!($("#h"+id)?.checked),next:Date.now()+R(4e3,9e3)};flash[id]="Объявление опубликовано — ждите сообщений"}
    render();return}
  if(d.unlist){const c=S.cars.find(x=>x.id==d.unlist);c.status="idle";delete c.listed;closeThreads(c.id,"Объявление снято с продажи.");render();return}
  if(d.stage){const st=STAGES.find(x=>x.k===d.stage);flash.svc="";
    if(Object.values(S.stages).some(x=>!x.done))flash.svc="Стройка уже идёт";else if(S.bal<st.c)flash.svc="Не хватает денег на этап";
    else{S.bal-=st.c;S.stages[st.k]={fin:Date.now()+st.h*TS,done:false}}render()}
}
